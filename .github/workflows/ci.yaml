name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build (with version stamp)
        shell: bash
        run: |
          # --always falls back to a commit SHA when no tags are reachable,
          # so this command always succeeds and never returns empty.
          VERSION=$(git describe --tags --always --dirty)
          echo "Building qvm $VERSION"
          go build -ldflags "-X github.com/trollixx/qvm/internal/cli.Version=$VERSION" ./...

      - name: Test
        # Space-separated flag value (not -coverprofile=coverage.txt) so PowerShell
        # on Windows doesn't split the dotted filename into a separate argument.
        run: go test -coverprofile coverage.txt ./...

      - name: Race-detector test
        # Race detector requires cgo, which is reliably available on ubuntu-latest.
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.txt

  # Real end-to-end install: download -> extract -> qt.conf patch -> prefix,
  # then verify qmake reports the installed version. Covers Windows (x64 +
  # arm64) and macOS arm64; the macOS build is universal, so Intel is exercised
  # too. Linux is excluded -- qvm does not install Qt there (use distro packages).
  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Qt and verify qmake
        shell: bash
        run: |
          ext=""
          [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          go build -o "qvm$ext" ./cmd/qvm
          "./qvm$ext" install 6.8.3 --dir "$RUNNER_TEMP/Qt"
          prefix=$("./qvm$ext" prefix 6.8.3)
          echo "prefix: $prefix"
          version=$("$prefix/bin/qmake$ext" -query QT_VERSION)
          echo "qmake QT_VERSION: $version"
          test "$version" = "6.8.3"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v7

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
