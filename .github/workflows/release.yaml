name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          ldflags="-X github.com/trollixx/qvm/internal/cli.Version=$VERSION"
          build() { GOOS=$1 GOARCH=$2 go build -ldflags "$ldflags" -o "$3" ./cmd/qvm; }
          build windows amd64 qvm-windows-amd64.exe
          build windows arm64 qvm-windows-arm64.exe
          build darwin  amd64 qvm-macos-amd64
          build darwin  arm64 qvm-macos-arm64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            qvm-windows-amd64.exe \
            qvm-windows-arm64.exe \
            qvm-macos-amd64 \
            qvm-macos-arm64
